name: Build and release
on:
  push:
    branches: [master, release]
  pull_request:
    branches: [master, release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assign version and reject duplicates
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          CHECKS_ONLY: ${{ github.event_name == 'pull_request' }}
        run: python tools/releases.py metadata --branch "$BRANCH" --run-number "$RUN_NUMBER" >> "$GITHUB_OUTPUT"
  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            platform: linux-x64
          - os: windows-2022
            target: windows
            platform: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.425
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools libfuse2
      - name: Pinned editor and templates
        run: python tools/bootstrap.py
      - name: Game and launcher checks
        run: python tools/dev.py check
      - name: Real installation/update checks
        run: python tools/check_distribution.py --target ${{ matrix.target }}
      - name: Fetch previous full package for deltas
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/releases.py seed --channel ${{ needs.identity.outputs.channel }} --platform ${{ matrix.platform }} --directory artifacts/releases/player/${{ matrix.platform }}
      - name: Package player release
        run: python tools/dev.py pack --target ${{ matrix.target }} --profile player --channel ${{ needs.identity.outputs.channel }} --version ${{ needs.identity.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-${{ matrix.platform }}
          path: artifacts/releases/player/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name != 'pull_request'
    needs: [identity, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: player-*
          path: artifacts/publish
          merge-multiple: true
      - name: Publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/releases.py publish --channel ${{ needs.identity.outputs.channel }} --version ${{ needs.identity.outputs.version }} --commit ${{ github.sha }} --directory artifacts/publish
